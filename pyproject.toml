[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miduo"
version = "0.1.0"
description = "Automatic duo arranger for MusicXML scores"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "music21>=9.9,<10",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
miduo = "miduo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/miduo"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
